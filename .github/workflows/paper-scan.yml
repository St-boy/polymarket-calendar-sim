name: Paper scan (order book)

on:
  # Primary: external cron (cron-job.org) hits /api/trigger-scan → workflow_dispatch
  workflow_dispatch:
  # Backup only — GitHub schedule is often ~hourly, not reliable at */15
  schedule:
    - cron: "7 * * * *"

permissions:
  contents: write

concurrency:
  group: paper-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install
        run: npm ci

      - name: Run paper scan
        env:
          SIM_WRITE_FILE: "1"
        run: npm run scan

      - name: Commit state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/sim-state.json
          if git diff --staged --quiet; then
            echo "No state changes"
            exit 0
          fi
          # [skip vercel] avoids redeploying the dashboard every scan
          git commit -m "chore(sim): update paper state $(date -u +%Y-%m-%dT%H:%MZ) [skip vercel]"
          git pull --rebase origin main
          git push
